# OpenSSF Scorecard: an outside reading of how this repository is kept —
# pinned dependencies, token permissions, branch protection, a security
# policy, static analysis. Weekly, because most of what it scores changes in
# the repository's settings rather than in a commit.
#
# The results go to the Security tab and, through publish_results, to the
# public Scorecard API the README badge reads. Publishing is what restricts
# this file: no top-level env or defaults, no write permission at the top,
# and only the actions the Scorecard API accepts in the job.
name: Scorecard

on:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # prove to the Scorecard API which workflow published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
