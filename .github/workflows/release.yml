# Shipping, in one step: push a `v*` tag.
#
# The whole quality gate runs again against the tagged commit (not against
# whatever was green on main a week ago), and only then is a release published
# with a deterministically packed tarball, the locked dependency inventory, a
# CycloneDX SBOM, their checksums, and a signed build-provenance attestation
# covering every one of them, attached as an asset of its own.
#
# Deployment stays a deliberate operator action on the vault host:
#
#     sudo ./scripts/update.sh --to vX.Y.Z
#
# update.sh audits dependencies, runs the tests, builds, switches the symlink,
# runs verify() and rolls back automatically if acceptance fails. Giving CI an
# SSH key with root on the vault host would make a compromised workflow a
# compromised vault; the one-line operator command is both simpler and safer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is only worth publishing if it passes exactly the same gate as main.
  ci:
    name: CI
    # zizmor prefers the newer "$/..." form here, which pins the reusable
    # workflow to this repository explicitly. "./..." already resolves to this
    # repository at this ref for a local reusable workflow, and it is the form
    # GitHub has documented for years; the release path is the one thing here
    # that cannot be exercised on a pull request, so it keeps the syntax with
    # the longer track record.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    # A called workflow's jobs get at most what the caller grants, and ci.yml's
    # Security scan uploads its SARIF to code scanning.
    permissions:
      contents: read
      security-events: write

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write # record it
    steps:
      - name: Refuse to run on anything but a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::Releases are cut from tags. Got ${REF_TYPE} '${REF_NAME}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout otherwise leaves the workflow token in .git/config,
          # readable by every later step in the job. Nothing here pushes
          # over git.
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      # setup-beam reports its `otp-version` already prefixed — `OTP-27.3.4`,
      # not `27.3.4`. Every consumer here writes a prefix of its own, so the
      # value is stripped once, here, rather than corrected at each use: the
      # first release went out as `vigil-0.1.1-otpOTP-27.3.4-...` because two
      # places read the raw output and neither adjusted it. `#OTP-` removes the
      # prefix when it is there and leaves the value alone when it is not, so
      # this holds if setup-beam ever reports the bare version.
      - name: State the OTP version once
        id: otp
        env:
          OTP: ${{ steps.beam.outputs.otp-version }}
        run: |
          set -euo pipefail
          echo "version=${OTP#OTP-}" >> "$GITHUB_OUTPUT"

      # The one time the artifacts carry is the commit's, so a rebuild of the
      # same commit tomorrow stamps the same time: every tarball entry and the
      # SBOM's timestamp. Exported for every later step, the way the
      # reproducible-builds convention expects to find it.
      - name: Take the build time from the commit
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Fetch dependencies
        env:
          MIX_ENV: prod
        run: mix deps.get --check-locked --only prod

      # A tag that disagrees with mix.exs produces a release whose reported
      # version is a lie, and `bin/vigil eval` on the server would then print
      # something other than the tag the operator deployed.
      - name: Verify the tag matches the version in mix.exs
        id: version
        env:
          MIX_ENV: prod
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --no-compile: this step reads a value mix.exs declares, and
          # building the application to learn it is what made the first tag
          # fail. Only `mix deps.get` has run by now — it fetches sources
          # without building them — so `mix run` compiled lib/ against an
          # uncompiled plug and stopped at `use Plug.Router`. `--no-deps-check`
          # silences the staleness check, not the build.
          project_version="$(mix run --no-start --no-compile --no-deps-check -e 'IO.puts(Mix.Project.config()[:version])' | tail -1)"
          tag_version="${REF_NAME#v}"
          echo "mix.exs: ${project_version} / tag: ${tag_version}"
          if [ "${project_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${REF_NAME} does not match mix.exs version ${project_version}. Bump mix.exs or retag."
            exit 1
          fi
          echo "version=${project_version}" >> "$GITHUB_OUTPUT"

      - name: Build the production release
        env:
          MIX_ENV: prod
        run: mix release --overwrite --path _release/vigil

      # What the tarball bundles, as CycloneDX: the prod Hex packages with
      # the checksums mix.lock pins, and the ERTS and Elixir this VM hands
      # `mix release`. Generated by the project's own task — no SBOM tool
      # from outside runs in a job that can sign.
      - name: Write the SBOM
        env:
          MIX_ENV: prod
        run: mix vigil.sbom --output _sbom/vigil.cdx.json

      # scripts/package_release.sh packs deterministically (sorted entries,
      # SOURCE_DATE_EPOCH, owner 0, gzip -n), adds LICENSE and the
      # third-party notices, and writes the checksums. It is the same script
      # scripts/test/package_release_test.sh and reproducible_release.sh run
      # locally, so what is tested is what ships.
      - name: Package artifacts
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OTP: ${{ steps.otp.outputs.version }}
        run: |
          set -euo pipefail
          name="vigil-${VERSION}-otp${OTP}-linux-x86_64"
          # The locked dependency inventory travels with the artifact, so the
          # exact third-party set of a shipped build can be reconstructed
          # later without checking out the tag.
          ./scripts/package_release.sh _release/vigil dist "${name}" _sbom/vigil.cdx.json
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # Proves the archive is complete and its ERTS runs: `eval` boots the VM
      # and evaluates runtime.exs without starting the supervision tree, so it
      # needs no vault and no credentials.
      - name: Verify the packaged artifact
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          tar -xzf "${TARBALL}" -C /tmp/verify
          reported="$(/tmp/verify/bin/vigil eval 'IO.puts(Application.spec(:vigil, :vsn))' | tail -1)"
          echo "release reports version: ${reported}"
          test "${reported}" = "${VERSION}"
          test -f /tmp/verify/LICENSE
          test -f /tmp/verify/THIRD_PARTY_NOTICES.md

      # Cryptographic provenance: which workflow, from which commit, built
      # these exact files. One attestation names every file in dist/ as a
      # subject: tarball, lock file, SBOM and checksums. Verifiable with
      # `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The attestation also lives in GitHub's attestation store, but only an
      # asset is visible to someone looking at the release — including the
      # OpenSSF Scorecard's Signed-Releases check, which looks for a
      # *.intoto.jsonl beside the artifacts. It also lets
      # `gh attestation verify --bundle` check a file against the attached
      # bundle rather than the store.
      - name: Attach the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "dist/${NAME}.intoto.jsonl"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          NAME: ${{ steps.package.outputs.name }}
          OTP: ${{ steps.otp.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Anything with a pre-release suffix (v1.2.0-rc.1) is published as a
          # pre-release, so `update.sh --to` never picks it up by accident.
          prerelease=""
          case "${REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac

          cat > notes.md <<EOF
          ## Deploy

          On the vault host:

          \`\`\`bash
          sudo ./scripts/update.sh --to ${REF_NAME}
          \`\`\`

          \`update.sh\` audits dependencies, runs the tests, builds the release,
          switches over and runs \`verify()\` — rolling back automatically if
          acceptance fails. Roll back manually at any time with
          \`sudo ./scripts/update.sh --rollback\`.

          ## Artifacts

          The attached tarball is a prebuilt OTP release for linux-x86_64 on
          OTP ${OTP}, for hosts without a build toolchain. Verify it before
          use:

          \`\`\`bash
          sha256sum -c ${NAME}-SHA256SUMS
          gh attestation verify ${NAME}.tar.gz --repo ${REPO}
          # or against the attached bundle instead of GitHub's attestation store:
          gh attestation verify ${NAME}.tar.gz --repo ${REPO} --bundle ${NAME}.intoto.jsonl
          \`\`\`

          - \`${NAME}-mix.lock\` is the exact dependency set this build was made from.
          - \`${NAME}.cdx.json\` is its CycloneDX SBOM, including the bundled ERTS.
          - \`${NAME}.intoto.jsonl\` is the build-provenance attestation for every
            file above.

          ---
          EOF

          gh release create "${REF_NAME}" \
            --title "${REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            ${prerelease} \
            dist/*
