bike:      "Gear: bike, components, equipment, maintenance"
training:  "Body: planning, nutrition, recovery, metrics"
projects:  "Software projects. One subdirectory per project, main note = project name"
phantom:   "Key without a matching directory, to exercise the drift warning"
journal:
  description: "Chronological, hidden from the default search"
  naming:
    pattern: '^\d{4}-\d{2}-\d{2}\.md$'
    scope: filename
    suggestion: date
    hint: "Journal notes are named YYYY-MM-DD.md"
